# Sentinelle : messagerie souveraine de l'administration.
# Installation : `docker compose up -d --build` (aucun service tiers requis).
# ATTENTION : tous les secrets ci-dessous sont des valeurs de DEMONSTRATION.
# Voir docs/NOTE_SECURITE.md pour la procedure de durcissement en production.

name: sentinelle

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: demo-postgres-pw
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      SYNAPSE_DB_PASSWORD: demo-synapse-db-pw
      KEYCLOAK_DB_PASSWORD: demo-keycloak-db-pw
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: demo-keycloak-db-pw
      KC_HOSTNAME: http://auth.localhost:8080
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-demo-a-changer
    volumes:
      - ./deploy/keycloak/realm-sentinelle.json:/opt/keycloak/data/import/realm-sentinelle.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # L'image Keycloak n'a pas curl : requete HTTP via bash (port de gestion 9000).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks: [internal]

  synapse-init:
    image: matrixdotorg/synapse:v1.139.0
    entrypoint: ["python", "-m", "synapse.app.homeserver", "--config-path", "/config/homeserver.yaml", "--generate-keys"]
    volumes:
      - synapse_data:/data
      - ./deploy/synapse:/config:ro
    networks: [internal]

  synapse:
    image: matrixdotorg/synapse:v1.139.0
    restart: unless-stopped
    environment:
      SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
    volumes:
      - synapse_data:/data
      - ./deploy/synapse:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      synapse-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      proxy:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [internal]

  element:
    image: vectorim/element-web:latest
    restart: unless-stopped
    volumes:
      - ./deploy/element/config.json:/app/config.json:ro
    networks: [internal]

  portal:
    build: ./portal
    restart: unless-stopped
    environment:
      KEYCLOAK_URL: http://auth.localhost:8080
      KEYCLOAK_REALM: sentinelle
      PORTAL_CLIENT_ID: portal
      PORTAL_CLIENT_SECRET: demo-portal-client-secret
      KC_ADMIN_CLIENT_ID: portal-admin
      KC_ADMIN_CLIENT_SECRET: demo-portal-admin-secret
      SYNAPSE_URL: http://synapse:8008
      MATRIX_SERVER_NAME: sentinelle.local
      SYNAPSE_SHARED_SECRET: demo-registration-shared-secret
      PORTAL_BASE_URL: http://admin.localhost:8080
      PORTAL_SESSION_SECRET: demo-session-secret-a-changer
      SEED_DEMO: "1"
    volumes:
      - portal_data:/data
    depends_on:
      synapse:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [internal]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      internal:
        # Memes URL vues depuis le navigateur et depuis les conteneurs
        # (necessaire a la redirection OIDC et a l'emission des jetons).
        aliases:
          - chat.localhost
          - matrix.localhost
          - auth.localhost
          - admin.localhost

  verifier:
    # Preuve « le serveur ne lit rien » : docker compose --profile outils run --rm verifier MOT-TEMOIN
    image: postgres:16-alpine
    profiles: ["outils"]
    entrypoint: ["sh", "/verify.sh"]
    environment:
      PGHOST: postgres
      PGUSER: synapse
      PGPASSWORD: demo-synapse-db-pw
      PGDATABASE: synapse
    volumes:
      - ./scripts/verify-no-plaintext.sh:/verify.sh:ro
      - synapse_data:/synapse-data:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  synapse_data:
  portal_data:
